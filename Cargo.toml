[package]
name = "mmbak-parser"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mmbak"
path = "src/main.rs"

[lib]
name = "mmbak_parser"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
chrono = { version = "0.4.44", features = ["clock"] }

[dev-dependencies]
tempfile = "3.14"
