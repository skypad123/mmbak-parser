[package]
name = "mmbak-parser"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mmbak"
path = "src/main.rs"

[lib]
name = "mmbak_parser"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
chrono = { version = "0.4.44", features = ["clock"] }
ratatui = "0.29"
crossterm = "0.28"

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
google-sheets4 = "7"
hyper-rustls = { version = "0.27", features = ["ring"] }
yup-oauth2 = { version = "12", features = ["service-account", "hyper-rustls"] }
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
tempfile = "3.14"
